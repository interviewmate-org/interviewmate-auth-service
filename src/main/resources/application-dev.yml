spring:
  application:
    name: authservice
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/interviewmate}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
      dialect: org.hibernate.dialect.MySQLDialect
    show-sql: true
  security:
    user:
      name: user
      password: 123
server:
  port: 8081
